[workspace]
resolver = "2"
members = ["native/rust-core", "native/napi", "native/ffi", "native/scriptc", "native/wasm"]

[workspace.package]
# Matches the latest release tag (vX.Y.Z); bump it together with the tag.
version = "0.7.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Default release profile on purpose: no LTO or target-cpu tuning until a
# baseline exists. Any change here must be recorded with published results.
[profile.release]
